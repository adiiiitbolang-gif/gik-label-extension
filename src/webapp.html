<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIK Production</title>
<style>
:root{--bg:#f4f6f3;--panel:#fff;--ink:#1d2721;--muted:#66736a;--line:#d9e0da;--soft:#eef2ee;--accent:#2f6f43;--accent-ink:#fff;--warn-bg:#fff4e0;--warn-ink:#7a4b00;--bad:#b3261e;--ok-bg:#e5f3e8;--ok-ink:#1e5631;--font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171c19;--panel:#20271f;--ink:#e4eae5;--muted:#9aa79e;--line:#334039;--soft:#262f29;--accent:#7cc08d;--accent-ink:#0f1a12;--warn-bg:#3a2e17;--warn-ink:#f3cf8f;--bad:#ff8a80;--ok-bg:#1f3a27;--ok-ink:#b7e4c2;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font)}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left)) 0}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{font-size:17px;margin:0}
.brand .who{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:14px 16px 120px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:14px}
.ok{background:var(--ok-bg);color:var(--ok-ink);border-radius:10px;padding:10px 12px;font-size:14px}
.muted{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{flex:1;min-width:180px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 12px}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* production sheet */
.sheet-head,.prow{display:grid;grid-template-columns:minmax(0,1fr) 92px 112px 92px 64px 72px;gap:8px;align-items:center}
.sheet-head{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 12px 6px}
.prow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.prow.filled{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pname{font-weight:600;line-height:1.2}
.psub{color:var(--muted);font-size:12px}
.num{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right;padding:0 8px;font-variant-numeric:tabular-nums}
.num:focus,.search:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.unit{position:relative}
.unit span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.unit .num{padding-right:30px}
.chk{width:26px;height:26px;accent-color:var(--accent);justify-self:center}
.yield{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.yield.warn{color:var(--bad);font-weight:600}
.lbl-m{display:none}
@media (max-width:720px){
  .sheet-head{display:none}
  .prow{grid-template-columns:1fr 1fr;row-gap:6px}
  .prow .pinfo{grid-column:1/3}
  .lbl-m{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
  .prow .cprint{display:flex;align-items:center;gap:8px}
  .chk{justify-self:start}
}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:6}
.bar .sum{flex:1;font-size:14px;min-width:0}
.primary{height:50px;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}
.ghost{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-weight:600;cursor:pointer}
.danger{color:var(--bad)}
/* packing */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.field{display:grid;gap:4px}
.field>span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.krow{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 84px minmax(0,150px) 40px;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.krow:first-child{border-top:0}
.pick{position:relative}
.pick input{width:100%}
.menu{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:280px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer}
.menu button:hover,.menu button:focus{background:var(--soft)}
.rowinfo{grid-column:1/-1;font-size:13px;color:var(--muted)}
select.num{text-align:left}
.x{height:42px;width:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:18px}
@media (max-width:720px){.krow{grid-template-columns:1fr 1fr 1fr}.krow .pick,.krow .kbatch{grid-column:1/-1}.krow .x{grid-column:3;justify-self:end}}
/* labels */
.previews{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.previews canvas{width:200px;height:120px;border:1px solid var(--line);border-radius:4px;background:#fff}
.actions{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.list{display:grid;gap:6px}
.lrow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:15px;margin:18px 0 8px}
.printsheet{display:none}
dialog{border:0;border-radius:14px;padding:18px;max-width:min(520px,92vw);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog ul{padding-left:18px;margin:8px 0;max-height:50vh;overflow:auto}
.drow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
</style>
<style id="label-css"></style>
<style>@media print{.top,main,.bar,dialog{display:none!important}.printsheet{display:block!important}}</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>GIK Production</h1><span class="who" id="who"></span></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="prod" aria-selected="true">Production</button>
    <button class="tab" role="tab" data-tab="pack" aria-selected="false">Packing</button>
    <button class="tab" role="tab" data-tab="labels" aria-selected="false">Labels</button>
  </nav>
</header>

<main>
  <div id="status" class="note" hidden></div>

  <section id="v-prod" data-view="prod">
    <div class="toolbar">
      <input id="psearch" class="search" type="search" placeholder="Search recipe or code" autocomplete="off">
      <button id="pfilled" class="chip" aria-pressed="false">Filled only</button>
      <button id="pclear" class="chip">Clear all</button>
    </div>
    <div class="sheet-head"><span>Recipe</span><span>Std batches</span><span>Output</span><span>Containers</span><span style="text-align:center">Print</span><span style="text-align:right">Yield</span></div>
    <div id="plist"></div>
  </section>

  <section id="v-pack" data-view="pack" hidden>
    <div class="card">
      <div class="field"><span>Outlet</span><div class="chips" id="outlets"></div></div>
      <p class="muted" id="cknote" hidden>Central Kitchen = internal repack, stock is not deducted.</p>
    </div>
    <div class="card" id="krows"></div>
    <div class="toolbar">
      <button id="kadd" class="ghost">+ Add product</button>
      <label class="chip" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="kprint" checked> Print labels</label>
    </div>
  </section>

  <section id="v-labels" data-view="labels" hidden>
    <div id="lblset" class="card" hidden>
      <b id="lbltitle"></b>
      <div class="actions">
        <button id="share" class="primary">Send to printer app</button>
        <button id="openext" class="ghost">Open in browser to print</button>
        <button id="printnow" class="ghost">Print here</button>
      </div>
      <div id="lblnote" class="note" hidden style="margin-top:10px"></div>
      <div class="previews" id="previews"></div>
    </div>
    <h2>Recent production</h2>
    <div class="list" id="recentB"><p class="muted">Loading…</p></div>
    <h2>Recent packing</h2>
    <div class="list" id="recentP"><p class="muted">Loading…</p></div>
  </section>
</main>

<div class="bar" id="bar">
  <div class="sum" id="sum"></div>
  <button class="primary" id="submit" disabled>Submit</button>
</div>

<dialog id="confirm">
  <b id="ctitle"></b>
  <ul id="clist"></ul>
  <div class="drow"><button class="ghost" id="cno">Back</button><button class="primary" id="cyes">Submit</button></div>
</dialog>

<div class="printsheet sheet" id="printsheet"></div>

<script src="https://lf1-cdn-tos.bytegoofy.com/goofy/lark/op/h5-js-sdk-1.5.34.js"></script>
<script src="./webapp.js"></script>
</body>
</html>
