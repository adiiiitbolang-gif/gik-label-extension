<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Print Production Label</title>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--ink:#1f2a23;--muted:#66736a;--line:#d8dfd9;--accent:#3f7d4e;--warn-bg:#fff4e0;--warn-ink:#7a4b00;--font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#1a1f1c;--panel:#222924;--ink:#e5ebe6;--muted:#9aa79e;--line:#34413a;--accent:#7cc08d;--warn-bg:#3a2e17;--warn-ink:#f3cf8f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
.ui{max-width:560px;margin:0 auto;padding-block:16px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
h1{font-size:17px;margin:0}
#title{font-weight:600;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper button{height:52px;font:600 24px var(--font);border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.stepper input{height:52px;text-align:center;font:600 20px var(--font);border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-width:0;width:100%}
label.f{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#printBtn{height:56px;font:700 17px var(--font);border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:13px}
.sheet{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .label{box-shadow:0 0 0 1px var(--line)}
</style>
<style id="label-css"></style>
</head>
<body>
<div class="ui">
  <div>
    <h1>Print production label</h1>
    <div id="title"></div>
  </div>
  <div id="empty" class="note" hidden>Open this page from the "Print label" link on a batch in Lark Base.</div>
  <label class="f" for="copies">Labels to print</label>
  <div class="stepper">
    <button type="button" id="minus" aria-label="One less label">−</button>
    <input id="copies" type="number" inputmode="numeric" min="1" max="200" value="1">
    <button type="button" id="plus" aria-label="One more label">+</button>
  </div>
  <button type="button" id="printBtn">Print labels</button>
  <div id="inapp" class="note" hidden>If nothing happens on your phone: tap ⋯ at the top right and choose "Open in browser", then press Print labels again and pick your label printer.</div>
  <div class="muted">Printer: paper 50 × 30 mm, margins none, scale 100%.</div>
</div>
<div class="sheet" id="sheet" aria-label="Label preview"></div>
<script src="./print.js"></script>
</body>
</html>
