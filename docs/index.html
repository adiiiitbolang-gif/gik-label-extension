<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIK Production Label</title>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--ink:#1f2a23;--muted:#66736a;--line:#d8dfd9;--accent:#3f7d4e;--font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#1a1f1c;--panel:#222924;--ink:#e5ebe6;--muted:#9aa79e;--line:#34413a;--accent:#7cc08d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--font)}
.ui{padding:12px;display:grid;gap:10px}
h1{font-size:14px;margin:0}
.muted{color:var(--muted);font-size:12px}
select,input{width:100%;font:13px var(--font);padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
label{display:grid;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1 1 120px;font:600 13px var(--font);border-radius:6px;padding:9px 10px;cursor:pointer;border:1px solid var(--accent)}
.primary{background:var(--accent);color:#fff}
.secondary{background:transparent;color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#picked{font-weight:600}
#status{background:#fff4e0;color:#7a4b00;border-radius:6px;padding:7px 9px;font-size:12px}
.sheet{display:flex;flex-wrap:wrap;gap:10px;padding:0 12px 16px}
.sheet .label{box-shadow:0 0 0 1px var(--line)}
</style>
<style id="label-css"></style>
</head>
<body>
<div class="ui">
  <div>
    <h1>Production Label · 50 × 30 mm</h1>
    <div class="muted">Click a row in Production Batches, or choose a batch below.</div>
  </div>
  <label for="batchSelect">Batch<select id="batchSelect"><option value="">Loading batches…</option></select></label>
  <div id="picked" class="muted"></div>
  <label for="copies">Labels to print<input id="copies" type="number" min="1" max="200" value="1"></label>
  <div class="row">
    <button type="button" id="printBtn" class="primary">Print labels</button>
    <button type="button" id="windowBtn" class="secondary">Open print window</button>
  </div>
  <div id="status" hidden></div>
  <a id="fallbackLink" target="_blank" rel="noopener" hidden>Open print page</a>
  <div class="muted">Printer: paper 50 × 30 mm, margins none, scale 100%, headers/footers off.</div>
</div>
<div class="sheet" id="sheet" aria-label="Label preview"></div>
<script src="./app.js?v=1792424648"></script>
</body>
</html>
